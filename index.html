<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دليل عروض الصيدلية</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Google Font Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">

    <!-- Header Section -->
    <header class="bg-emerald-700 text-white shadow-lg sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-prescription-bottle-medical text-3xl text-emerald-300"></i>
                <div>
                    <h1 class="text-2xl font-bold">دليل عروض الصيدلية</h1>
                    <p class="text-xs text-emerald-100">تحديثات مستمرة ومباشرة للعروض والخصومات</p>
                </div>
            </div>
            
            <!-- Controls: View Switch & Reload -->
            <div class="flex items-center gap-2 bg-emerald-800/60 p-1.5 rounded-xl border border-emerald-600">
                <button id="btnBrandView" onclick="switchView('brand')" class="px-4 py-2 rounded-lg text-sm font-semibold transition bg-white text-emerald-800 shadow">
                    <i class="fa-solid fa-boxes-stacked ml-1"></i> البراندات والمنتجات
                </button>
                <button id="btnTimelineView" onclick="switchView('timeline')" class="px-4 py-2 rounded-lg text-sm font-semibold transition text-emerald-100 hover:text-white">
                    <i class="fa-solid fa-timeline ml-1"></i> الشريط الزمني
                </button>
                <button onclick="fetchOffers()" class="p-2 rounded-lg text-emerald-200 hover:text-white hover:bg-emerald-700 transition" title="تحديث البيانات">
                    <i class="fa-solid fa-arrows-rotate"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Filter & Search Bar -->
    <section class="max-w-7xl mx-auto px-4 mt-6">
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex flex-col md:flex-row gap-4 items-center justify-between">
            <!-- Search input -->
            <div class="relative w-full md:w-96">
                <i class="fa-solid fa-magnifying-glass absolute right-3.5 top-3.5 text-slate-400"></i>
                <input type="text" id="searchInput" oninput="applyFilters()" placeholder="ابحث باسم الشركة، المنتج، أو العرض..." 
                       class="w-full pr-10 pl-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white text-sm">
            </div>

            <!-- Active Status Toggle Filter -->
            <div class="flex items-center gap-3 w-full md:w-auto justify-end">
                <span class="text-sm font-medium text-slate-600">تصفية العروض:</span>
                <select id="statusFilter" onchange="applyFilters()" class="bg-slate-50 border border-slate-300 text-sm rounded-xl px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-emerald-500 font-semibold">
                    <option value="active">العروض النشطة حالياً فقط (Active)</option>
                    <option value="all">جميع العروض (النشطة والمنتهية)</option>
                </select>
            </div>
        </div>
    </section>

    <!-- Main Content Area -->
    <main class="max-w-7xl mx-auto px-4 py-6">
        <!-- Loading State -->
        <div id="loadingState" class="text-center py-20">
            <i class="fa-solid fa-circle-notch fa-spin text-4xl text-emerald-600 mb-3"></i>
            <p class="text-slate-600 font-medium">جاري تحميل العروض المباشرة من الجدول...</p>
        </div>

        <!-- Error State -->
        <div id="errorState" class="hidden text-center py-16 bg-white rounded-2xl border border-red-200 shadow-sm">
            <i class="fa-solid fa-triangle-exclamation text-4xl text-red-500 mb-3"></i>
            <p class="text-slate-700 font-semibold mb-2">تعذر جلب البيانات من Google Sheet</p>
            <p class="text-xs text-slate-500">يرجى التأكد من أن الجدول متاح للعامة (Anyone with the link can view).</p>
        </div>

        <!-- Brands / Products Grid View -->
        <div id="brandView" class="hidden">
            <div id="brandsContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Cards will be populated here -->
            </div>
        </div>

        <!-- Timeline View (Horizontal Bars) -->
        <div id="timelineView" class="hidden">
            <div id="timelineContainer" class="space-y-4">
                <!-- Horizontal timeline items will be populated here -->
            </div>
        </div>
    </main>

    <!-- Modal for Image & Offer Details -->
    <div id="offerModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto transform transition-all p-6 relative">
            <button onclick="closeModal()" class="absolute top-4 left-4 text-slate-400 hover:text-slate-600 bg-slate-100 p-2 rounded-full transition">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
            
            <div id="modalContent">
                <!-- Dynamic Content Inside Modal -->
            </div>
        </div>
    </div>

    <script>
        const SHEET_ID = '1bdzT8v0ty00HEVgMWTbZaaEecss4uHxBC1Kc6Zqp0rw';
        const GID = '216553715';
        const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&gid=${GID}`;

        let allOffers = [];
        let currentView = 'brand';

        // قائمة أسماء الأشهر باللغة العربية
        const monthsArabic = [
            "يناير", "فبراير", "مارس", "أبريل", "مايو", "يونيو",
            "يوليو", "أغسطس", "سبتمبر", "أكتوبر", "نوفمبر", "ديسمبر"
        ];

        // دالة لتحليل التاريخ بتنسيق (الشهر/اليوم/السنة)
        function parseDateSafely(dateInput) {
             if (!dateInput) return null;
             let str = String(dateInput).trim();

             // إذا كان التنسيق القادم من Google Sheets كـ Date(YYYY,M,D)
             if (str.startsWith('Date(') && str.endsWith(')')) {
                 const dateParts = str.substring(5, str.length - 1).split(',').map(n => parseInt(n.trim(), 10));
                 return new Date(dateParts[0], dateParts[1], dateParts[2]);
             }

             const parts = str.split(/[\/\-]/);
             if (parts.length === 3) {
                 // بناءً على التوضيح: التنسيق هو الشهر / اليوم / السنة
                 const month = parseInt(parts[0], 10) - 1; // 0-indexed في JavaScript
                 const day = parseInt(parts[1], 10);
                 let year = parseInt(parts[2], 10);
                 if (year < 100) year += 2000;

                 if (!isNaN(day) && !isNaN(month) && !isNaN(year)) {
                     return new Date(year, month, day);
                 }
             }

             const parsed = new Date(str);
             return isNaN(parsed.getTime()) ? null : parsed;
        }

        // دالة تحويل التاريخ إلى صيغة عربية واضحة (اليوم + اسم الشهر بالعربي + السنة)
        function formatDateInArabic(dateObj) {
            if (!dateObj) return 'غير محدد';
            const day = dateObj.getDate();
            const month = monthsArabic[dateObj.getMonth()];
            const year = dateObj.getFullYear();
            return `${day} ${month} ${year}`;
        }

        async function fetchOffers() {
            document.getElementById('loadingState').classList.remove('hidden');
            document.getElementById('errorState').classList.add('hidden');
            document.getElementById('brandView').classList.add('hidden');
            document.getElementById('timelineView').classList.add('hidden');

            try {
                const response = await fetch(SHEET_URL);
                const text = await response.text();
                
                const jsonString = text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1);
                const data = JSON.parse(jsonString);

                const today = new Date();
                today.setHours(0, 0, 0, 0);

                allOffers = data.table.rows.map(row => {
                    const c = row.c;
                    const startDateStr = c[3] ? (c[3].f || c[3].v) : '';
                    const endDateStr = c[4] ? (c[4].f || c[4].v) : '';
                    
                    const startDateObj = parseDateSafely(startDateStr);
                    const endDateObj = parseDateSafely(endDateStr);

                    // تحويل التواريخ إلى نص عربي واضح (مثل: 10 أبريل 2026)
                    const startDateFormatted = startDateObj ? formatDateInArabic(startDateObj) : (startDateStr || 'غير محدد');
                    const endDateFormatted = endDateObj ? formatDateInArabic(endDateObj) : (endDateStr || 'غير محدد');

                    let isActive = false;
                    if (startDateObj && endDateObj) {
                         isActive = (today >= startDateObj) && (today <= endDateObj);
                    } else if (startDateObj && !endDateObj) {
                         isActive = today >= startDateObj;
                    } else if (!startDateObj && endDateObj) {
                         isActive = today <= endDateObj;
                    }

                    return {
                        brand: c[0] ? c[0].v : 'غير محدد',
                        product: c[1] ? c[1].v : '',
                        offer: c[2] ? c[2].v : '',
                        startDate: startDateFormatted,
                        endDate: endDateFormatted,
                        offerTime: c[5] ? c[5].v : '',
                        entryMethod: c[6] ? c[6].v : '',
                        imageUrl: c[7] ? c[7].v : '',
                        notes: c[8] ? c[8].v : '',
                        incentive: c[9] ? c[9].v : '',
                        isActive: isActive
                    };
                }).filter(item => item.brand || item.product);

                document.getElementById('loadingState').classList.add('hidden');
                applyFilters();

            } catch (err) {
                console.error(err);
                document.getElementById('loadingState').classList.add('hidden');
                document.getElementById('errorState').classList.remove('hidden');
            }
        }

        function applyFilters() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const statusFilter = document.getElementById('statusFilter').value;

            const filtered = allOffers.filter(item => {
                const matchesSearch = item.brand.toLowerCase().includes(search) || 
                                      item.product.toLowerCase().includes(search) || 
                                      (item.offer && item.offer.toLowerCase().includes(search));
                
                const matchesStatus = statusFilter === 'all' || item.isActive;
                return matchesSearch && matchesStatus;
            });

            renderBrandView(filtered);
            renderTimelineView(filtered);

            if (currentView === 'brand') {
                document.getElementById('brandView').classList.remove('hidden');
            } else {
                document.getElementById('timelineView').classList.remove('hidden');
            }
        }

        function renderBrandView(offers) {
            const container = document.getElementById('brandsContainer');
            if (offers.length === 0) {
                container.innerHTML = `<p class="col-span-full text-center text-slate-500 py-10">لا توجد عروض مطابقة للبحث.</p>`;
                return;
            }

            container.innerHTML = offers.map((item) => {
                const originalIndex = allOffers.indexOf(item);
                return `
                <div onclick="openModal(${originalIndex})" class="bg-white rounded-2xl p-5 shadow-sm hover:shadow-md transition border border-slate-200 cursor-pointer flex flex-col justify-between group">
                    <div>
                        <div class="flex justify-between items-start mb-3 gap-2">
                            <span class="bg-emerald-700 text-white text-base md:text-lg font-black px-3.5 py-1 rounded-full shadow-sm">
                                ${item.brand}
                            </span>
                            <span class="text-xs px-2.5 py-1 rounded-full font-semibold ${item.isActive ? 'bg-green-100 text-green-700' : 'bg-slate-100 text-slate-500'}">
                                ${item.isActive ? 'ساري' : 'غير نشط'}
                            </span>
                        </div>

                        <h3 class="font-bold text-slate-800 text-base mb-2 group-hover:text-emerald-600 transition line-clamp-2">
                            ${item.product}
                        </h3>

                        ${item.offer ? `<p class="text-sm font-semibold text-emerald-600 bg-emerald-50 px-3 py-1.5 rounded-lg inline-block mb-3">${item.offer}</p>` : ''}
                    </div>

                    <div class="pt-3 border-t border-slate-100 text-xs text-slate-500 flex justify-between items-center">
                        <span><i class="fa-regular fa-calendar ml-1"></i> ${item.startDate} إلى ${item.endDate}</span>
                        <span class="text-emerald-600 font-semibold">التفاصيل <i class="fa-solid fa-chevron-left text-[10px]"></i></span>
                    </div>
                </div>
                `;
            }).join('');
        }

        function renderTimelineView(offers) {
            const container = document.getElementById('timelineContainer');
            if (offers.length === 0) {
                container.innerHTML = `<p class="text-slate-500 py-10 text-center">لا توجد عروض مطابقة للشريط الزمني.</p>`;
                return;
            }

            container.innerHTML = offers.map((item) => {
                const originalIndex = allOffers.indexOf(item);
                const barGradient = item.isActive 
                    ? 'bg-gradient-to-l from-emerald-500 via-teal-500 to-emerald-600' 
                    : 'bg-slate-300';

                return `
                <div onclick="openModal(${originalIndex})" class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 hover:shadow-md transition cursor-pointer">
                    <div class="flex flex-wrap items-center justify-between gap-3 mb-3">
                        <div class="bg-emerald-700 text-white text-lg md:text-xl font-black px-4 py-1.5 rounded-full shadow-sm flex items-center gap-2">
                            <i class="fa-solid fa-building text-emerald-300 text-sm"></i>
                            <span>${item.brand}</span>
                        </div>
                        
                        <span class="text-xs px-3 py-1 rounded-full font-bold ${item.isActive ? 'bg-emerald-100 text-emerald-800' : 'bg-slate-100 text-slate-500'}">
                            ${item.isActive ? 'العرض ساري حالياً' : 'عرض منتهي'}
                        </span>
                    </div>

                    <div class="mb-4">
                        <h3 class="font-bold text-slate-800 text-lg">${item.product}</h3>
                        ${item.offer ? `<span class="text-sm font-bold text-emerald-700 bg-emerald-50 px-3 py-1 rounded-lg inline-block mt-1">${item.offer}</span>` : ''}
                    </div>

                    <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
                        <div class="flex justify-between items-center text-xs md:text-sm font-bold text-slate-700 mb-2">
                            <span class="flex items-center gap-1.5 bg-white px-3 py-1 rounded-lg border border-slate-200 shadow-2xs">
                                <i class="fa-regular fa-calendar-check text-emerald-600"></i>
                                البداية: <strong class="text-emerald-800">${item.startDate}</strong>
                            </span>
                            <span class="flex items-center gap-1.5 bg-white px-3 py-1 rounded-lg border border-slate-200 shadow-2xs">
                                <i class="fa-regular fa-calendar-xmark text-red-500"></i>
                                النهاية: <strong class="text-red-800">${item.endDate}</strong>
                            </span>
                        </div>

                        <div class="relative w-full h-5 bg-slate-200 rounded-full overflow-hidden p-0.5 border border-slate-300">
                            <div class="h-full rounded-full ${barGradient} transition-all duration-500 flex items-center justify-center text-[10px] text-white font-bold">
                                ${item.isActive ? 'ساري الفعالية' : ''}
                            </div>
                        </div>
                    </div>
                </div>
                `;
            }).join('');
        }

        function switchView(view) {
            currentView = view;
            const btnBrand = document.getElementById('btnBrandView');
            const btnTimeline = document.getElementById('btnTimelineView');

            if (view === 'brand') {
                btnBrand.className = "px-4 py-2 rounded-lg text-sm font-semibold transition bg-white text-emerald-800 shadow";
                btnTimeline.className = "px-4 py-2 rounded-lg text-sm font-semibold transition text-emerald-100 hover:text-white";
                document.getElementById('brandView').classList.remove('hidden');
                document.getElementById('timelineView').classList.add('hidden');
            } else {
                btnTimeline.className = "px-4 py-2 rounded-lg text-sm font-semibold transition bg-white text-emerald-800 shadow";
                btnBrand.className = "px-4 py-2 rounded-lg text-sm font-semibold transition text-emerald-100 hover:text-white";
                document.getElementById('timelineView').classList.remove('hidden');
                document.getElementById('brandView').classList.add('hidden');
            }
        }

        function openModal(index) {
            const item = allOffers[index];
            const modal = document.getElementById('offerModal');
            const content = document.getElementById('modalContent');

            content.innerHTML = `
                <div class="mb-4">
                    <span class="bg-emerald-700 text-white text-lg font-black px-4 py-1.5 rounded-full inline-block shadow-sm mb-2">
                        ${item.brand}
                    </span>
                    <h2 class="text-xl font-bold text-slate-800 mt-1">${item.product}</h2>
                </div>

                ${item.imageUrl ? `
                    <div class="mb-4 rounded-xl overflow-hidden bg-slate-100 max-h-72 flex items-center justify-center border border-slate-200">
                        <img src="${item.imageUrl}" alt="${item.product}" class="object-contain max-h-72 w-full" onerror="this.parentNode.style.display='none'">
                    </div>
                ` : ''}

                <div class="grid grid-cols-2 gap-3 mb-4 bg-slate-50 p-3 rounded-xl text-xs text-slate-700">
                    <div><strong>نوع العرض:</strong> ${item.offer || '-'}</div>
                    <div><strong>الفترة:</strong> ${item.startDate} إلى ${item.endDate}</div>
                    <div><strong>طريقة الإدخال:</strong> ${item.entryMethod || '-'}</div>
                    <div><strong>الحافز:</strong> ${item.incentive || '-'}</div>
                </div>

                ${item.notes ? `
                    <div class="mt-3 p-3 bg-amber-50 border border-amber-200 rounded-xl text-xs text-amber-900">
                        <strong><i class="fa-solid fa-circle-info ml-1"></i> ملاحظات وشروط العرض:</strong>
                        <p class="mt-1 whitespace-pre-line leading-relaxed">${item.notes}</p>
                    </div>
                ` : ''}
            `;

            modal.classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('offerModal').classList.add('hidden');
        }

        fetchOffers();
    </script>
</body>
</html>
